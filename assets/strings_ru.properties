# Rules Screen
rules_1=\u0422\u0438\u043f \u0438\u0433\u0440\u044b: \u0442\u0430\u043a\u0442\u0438\u0447\u0435\u0441\u043a\u0430\u044f \u0438\u0433\u0440\u0430\n\u041a\u043e\u043b\u0438\u0447\u0435\u0441\u0442\u0432\u043e \u0438\u0433\u0440\u043e\u043a\u043e\u0432: 1-4\n\u0420\u0435\u043a\u043e\u043c\u0435\u043d\u0434\u0443\u0435\u043c\u044b\u0439 \u0432\u043e\u0437\u0440\u0430\u0441\u0442: 8-88 \u043b\u0435\u0442\n\u041f\u0440\u043e\u0434\u043e\u043b\u0436\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u0441\u0442\u044c \u0438\u0433\u0440\u044b: \u043f\u0440\u0438\u043c\u0435\u0440\u043d\u043e 30-45 \u043c\u0438\u043d\u0443\u0442\n\n
rules_2=\u0426\u0415\u041b\u042c \u0418\u0413\u0420\u042b:\n\n\u0418\u0433\u0440\u043e\u043a, \u043a\u043e\u0442\u043e\u0440\u044b\u0439 \u043f\u0435\u0440\u0432\u044b\u043c \u043f\u0435\u0440\u0435\u043c\u0435\u0441\u0442\u0438\u0442 \u0432\u0441\u0435 \u0441\u0432\u043e\u0438 \u0444\u0438\u0448\u043a\u0438 \u0432 \u043f\u0440\u043e\u0442\u0438\u0432\u043e\u043f\u043e\u043b\u043e\u0436\u043d\u044b\u0439 \u0443\u0433\u043e\u043b, \u0438\u0441\u043f\u043e\u043b\u044c\u0437\u0443\u044f \u0442\u0430\u043a\u0442\u0438\u0447\u0435\u0441\u043a\u0438\u0435 \u0445\u043e\u0434\u044b, \u0432\u044b\u0438\u0433\u0440\u044b\u0432\u0430\u0435\u0442 \u0438\u0433\u0440\u0443.\n\n
rules_3=\u0418\u0413\u0420\u041e\u0412\u042b\u0415 \u041c\u0410\u0422\u0415\u0420\u0418\u0410\u041b\u042b:\n\n1 \u0434\u0432\u0443\u0441\u0442\u043e\u0440\u043e\u043d\u043d\u0435\u0435 \u0438\u0433\u0440\u043e\u0432\u043e\u0435 \u043f\u043e\u043b\u0435\n66 \u0444\u0438\u0448\u0435\u043a Halma:\n19 \u0447\u0435\u0440\u043d\u044b\u0445\n19 \u043a\u0440\u0430\u0441\u043d\u044b\u0445\n15 \u0437\u0435\u043b\u0435\u043d\u044b\u0445\n13 \u0436\u0435\u043b\u0442\u044b\u0445\n\n
rules_4=\u041f\u041e\u0414\u0413\u041e\u0422\u041e\u0412\u041a\u0410 \u041a \u0418\u0413\u0420\u0415:\n\n\u0412 \u0438\u0433\u0440\u0443 \u043c\u043e\u0433\u0443\u0442 \u0438\u0433\u0440\u0430\u0442\u044c 2, 3 \u0438\u043b\u0438 4 \u0447\u0435\u043b\u043e\u0432\u0435\u043a\u0430. \u041f\u043e\u043b\u0435 \u0441 \u043a\u0432\u0430\u0434\u0440\u0430\u0442\u043d\u043e\u0439 \u0440\u0430\u0437\u043c\u0435\u0442\u043a\u043e\u0439 \u043f\u043e\u0434\u0445\u043e\u0434\u0438\u0442 \u0434\u043b\u044f 2 \u0438\u043b\u0438 4 \u0438\u0433\u0440\u043e\u043a\u043e\u0432, \u0430 \u043f\u043e\u043b\u0435 \u0441\u043e \u0437\u0432\u0435\u0437\u0434\u043e\u0439 ? \u0434\u043b\u044f 2 \u0438\u043b\u0438 3 \u0438\u0433\u0440\u043e\u043a\u043e\u0432.\n\n
rules_5=\u041a\u043e\u043b\u0438\u0447\u0435\u0441\u0442\u0432\u043e \u0444\u0438\u0448\u0435\u043a \u043d\u0430 \u0438\u0433\u0440\u043e\u043a\u0430:\n2 \u0438\u0433\u0440\u043e\u043a\u0430: 2 \u00d7 19 \u0444\u0438\u0448\u0435\u043a\n3 \u0438\u0433\u0440\u043e\u043a\u0430: 3 \u00d7 15 \u0444\u0438\u0448\u0435\u043a\n4 \u0438\u0433\u0440\u043e\u043a\u0430: 4 \u00d7 13 \u0444\u0438\u0448\u0435\u043a\n\n
rules_6=\u041d\u0430 \u043a\u0432\u0430\u0434\u0440\u0430\u0442\u043d\u043e\u043c \u043f\u043e\u043b\u0435 \u0435\u0441\u0442\u044c 4 \u0443\u0433\u043b\u0430 \u0441 13 \u043a\u043b\u0435\u0442\u043a\u0430\u043c\u0438, \u043e\u0442\u0434\u0435\u043b\u0435\u043d\u043d\u044b\u043c\u0438 \u0441\u0438\u043d\u0435\u0439 \u043b\u0438\u043d\u0438\u0435\u0439. \u042d\u0442\u0438 13 \u043a\u043b\u0435\u0442\u043e\u043a \u0432\u043c\u0435\u0441\u0442\u0435 \u043d\u0430\u0437\u044b\u0432\u0430\u044e\u0442\u0441\u044f \"\u043c\u0430\u043b\u044b\u0439 \u0434\u0432\u043e\u0440\".\n\n
rules_7=\u0415\u0441\u043b\u0438 \u0438\u0433\u0440\u0430\u044e\u0442 \u0442\u043e\u043b\u044c\u043a\u043e 2 \u0447\u0435\u043b\u043e\u0432\u0435\u043a\u0430, \u0442\u043e 19 \u0444\u0438\u0448\u0435\u043a \u0440\u0430\u0437\u043c\u0435\u0449\u0430\u044e\u0442\u0441\u044f \u0432 \u0434\u0432\u0443\u0445 \u043f\u0440\u043e\u0442\u0438\u0432\u043e\u043f\u043e\u043b\u043e\u0436\u043d\u044b\u0445 \u0431\u043e\u043b\u044c\u0448\u0438\u0445 \u0434\u0432\u043e\u0440\u0430\u0445 \u0434\u043e \u0447\u0435\u0440\u043d\u043e\u0439 \u043b\u0438\u043d\u0438\u0438.\n\n
rules_8=\u0425\u041e\u0414 \u0418\u0413\u0420\u042b:\n\n\u041a\u0430\u0436\u0434\u044b\u0439 \u0438\u0433\u0440\u043e\u043a \u0441\u0442\u0440\u0435\u043c\u0438\u0442\u0441\u044f \u043a\u0430\u043a \u043c\u043e\u0436\u043d\u043e \u0431\u044b\u0441\u0442\u0440\u0435\u0435 \u0438 \u0442\u0430\u043a\u0442\u0438\u0447\u043d\u0435\u0435 \u043f\u0435\u0440\u0435\u043c\u0435\u0441\u0442\u0438\u0442\u044c \u0441\u0432\u043e\u0438 \u0444\u0438\u0448\u043a\u0438 \u0432 \u043f\u0440\u043e\u0442\u0438\u0432\u043e\u043f\u043e\u043b\u043e\u0436\u043d\u044b\u0439 \u0434\u0432\u043e\u0440.\n\n
rules_9=\u041f\u0415\u0420\u0415\u041c\u0415\u0429\u0415\u041d\u0418\u0415:\n\n\u0424\u0438\u0448\u043a\u0438 \u043c\u043e\u0436\u043d\u043e \u0434\u0432\u0438\u0433\u0430\u0442\u044c \u0432 \u043b\u044e\u0431\u043e\u043c \u043d\u0430\u043f\u0440\u0430\u0432\u043b\u0435\u043d\u0438\u0438: \u043d\u0430 \u043e\u0434\u043d\u0443 \u043a\u043b\u0435\u0442\u043a\u0443 \u043f\u043e \u0433\u043e\u0440\u0438\u0437\u043e\u043d\u0442\u0430\u043b\u0438, \u0432\u0435\u0440\u0442\u0438\u043a\u0430\u043b\u0438, \u0434\u0438\u0430\u0433\u043e\u043d\u0430\u043b\u0438, \u043d\u0430\u0437\u0430\u0434 \u0438\u043b\u0438 \u0432\u0431\u043e\u043a. \u0412 \u043e\u0434\u043d\u043e\u0439 \u043a\u043b\u0435\u0442\u043a\u0435 \u043c\u043e\u0436\u0435\u0442 \u043d\u0430\u0445\u043e\u0434\u0438\u0442\u044c\u0441\u044f \u0442\u043e\u043b\u044c\u043a\u043e \u043e\u0434\u043d\u0430 \u0444\u0438\u0448\u043a\u0430.\n\n

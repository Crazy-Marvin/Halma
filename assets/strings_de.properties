# Rules Screen
rules_1=Spieltyp: Taktikspiel\nSpielerzahl: 1-4\nAltersempfehlung: 8-88\nSpieldauer: ca. 30-45 Minuten\n\n
rules_2=SPIELZIEL:\n\nWer es zuerst schafft, seine Holzkegel durch geschickte Züge in den gegenüberliegenden Hof zu bringen, gewinnt das Spiel.\n\n
rules_3=SPIELMATERIAL:\n\n1 Doppelspielplan\n66 Halmakegel:\n19 schwarze\n19 rote\n15 grüne\n13 gelbe\n\n
rules_4=SPIELVORBEREITUNG\n\nDas Spiel kann von 2, 3 oder 4 Personen gespielt werden. Mit dem Karoplan können 2 oder 4 Spieler, mit dem Sternplan 2 oder 3 Spieler spielen.\n\n
rules_5=Es spielen:\n2 Personen mit 2 x 19 Kegeln\n3 Personen mit 3 x 15 Kegeln\n4 Personen mit 4 x 13 Kegeln\n\n
rules_6=Auf dem Karoplan befinden sich 4 Ecken mit 13 Feldern, die durch eine blaue Linie abgegrenzt sind. Diese 13 Felder werden zusammen der ?kleine Hof? genannt.\n\n
rules_7=Spielen nur 2 Personen, so werden die beiden sich schräg gegenüberliegende ?großen Höfe? bis zur schwarzen Linie mit 19 Kegeln besetzt.\n\n
rules_8=SPIELABLAUF:\n\nJeder Spieler versucht, so schnell und geschickt wie möglich, seine Kegel in den gegenüberliegenden Hof zu bringen.\n\n
rules_9=ZIEHEN\n\nAlle Zugrichtungen sind erlaubt: ein Feld waagerecht, senkrecht, diagonal, rückwärts oder seitwärts, je nach Belieben. Auf jedem Feld darf nur 1 Kegel stehen.\n\n
rules_10=SPRINGEN\n\nEin gegnerischer, aber auch ein eigener Kegel, der direkt vor oder neben einem steht, kann übersprungen werden, wenn unmittelbar dahinter ein freies Feld ist.\n\n
rules_11=KETTENSPRÜNGE\n\nKettensprünge sind aufeinanderfolgende Sprünge. In einem Zug können dabei mehrere Kegel übersprungen werden.\n\n
rules_12=Jeder Spieler sollte versuchen, mit den eigenen Kegeln Ketten aufzubauen, damit die eigene Mannschaft schneller vorankommt.\n\n
rules_13=TAKTISCHE SPIELTIPS\n\nEs liegt im Interesse eines jeden Spielers, in seinem Zug so viel wie möglich zu springen, um schneller im gegenüberliegenden Hof anzukommen.\n\n
rules_14=Ein gegnerischer Kegel kann bis zuletzt in seinem Hof eingeschlossen werden. Ebenso kann ein Spieler im eigenen Hof einen Kegel zurücklassen.\n\n
rules_15=Beteiligen sich 4 Personen am Spiel, so kann jeder Spieler für sich versuchen, einen der Höfe zu erobern.\n\n
rules_16=SPIELENDE\n\nSpiel ist sofort beendet, wenn ein Spieler mit seinem letzten Kegel das letzte noch freie Zielfeld im gegenüberliegenden Hof besetzt hat.\n\n
rules_17=STERNHALMA FÜR 2 BIS 3 PERSONEN\n\nBeim Halma-Spiel für 3 Personen wird mit dem 6zackigen Stern auf der Rückseite des Spielplans gespielt.\n\n
rules_18=Im Gegensatz zum Karoplan zieht man seine Kegel nicht auf Feldern sondern über Linien von Punkt zu Punkt.\n\n
rules_19=HALMA SOLO FÜR 1 SPIELER\n\nHalma kann man auch auf dem Karoplan alleine spielen.\n\n
rules_20=Diese Variante kann man natürlich auch mit 15 Kegeln auf dem Sternplan spielen.\n\n
rules_21=Alles verstanden? Dann tippe nochmal, um zurück zu kehren :)\n\n


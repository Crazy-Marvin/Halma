# Rules Screen
rules_1=Type de jeu : Jeu tactique\nNombre de joueurs : 1-4\nÂge recommandé : 8-88 ans\nDurée du jeu : environ 30-45 minutes\n\n
rules_2=OBJECTIF DU JEU :\n\nLe premier joueur à déplacer tous ses pions dans le camp opposé grâce à des déplacements stratégiques remporte la partie.\n\n
rules_3=MATÉRIEL DE JEU :\n\n1 plateau de jeu recto-verso\n66 pions Halma :\n19 noirs\n19 rouges\n15 verts\n13 jaunes\n\n
rules_4=PRÉPARATION DU JEU\n\nLe jeu peut se jouer à 2, 3 ou 4 joueurs. Avec le plateau carré, 2 ou 4 joueurs peuvent jouer, tandis qu'avec le plateau étoile, 2 ou 3 joueurs peuvent jouer.\n\n
rules_5=Nombre de pions par joueur :\n2 joueurs : 2 × 19 pions\n3 joueurs : 3 × 15 pions\n4 joueurs : 4 × 13 pions\n\n
rules_6=Le plateau carré comporte 4 coins avec 13 cases, délimitées par une ligne bleue. Ces 13 cases forment ensemble le "petit camp".\n\n
rules_7=Si seulement 2 personnes jouent, elles occupent chacune un "grand camp" opposé en diagonale, avec 19 pions jusqu'à la ligne noire.\n\n
rules_8=DÉROULEMENT DU JEU :\n\nChaque joueur essaie de déplacer ses pions vers le camp opposé aussi rapidement et stratégiquement que possible.\n\n
rules_9=DÉPLACEMENTS\n\nTous les déplacements sont autorisés : une case horizontalement, verticalement, en diagonale, en arrière ou sur le côté. Une seule pièce peut occuper une case à la fois.\n\n
rules_10=SAUTS\n\nUn pion, qu'il soit allié ou adverse, peut être sauté s'il est directement devant ou à côté et qu'il y a une case libre juste derrière.\n\n
rules_11=SAUTS EN CHAÎNE\n\nLes sauts en chaîne sont des sauts consécutifs. Un joueur peut sauter plusieurs pions en un seul tour.\n\n
rules_12=Chaque joueur doit essayer de former des chaînes avec ses propres pions pour avancer plus rapidement.\n\n
rules_13=CONSEILS STRATÉGIQUES\n\nIl est conseillé de sauter autant que possible en un seul tour pour atteindre plus rapidement le camp opposé.\n\n
rules_14=Un pion adverse peut être bloqué dans son camp jusqu'à la fin du jeu. De même, un joueur peut choisir de laisser un pion dans son propre camp.\n\n
rules_15=Si 4 personnes jouent, chaque joueur peut essayer de conquérir l'un des camps.\n\n
rules_16=FIN DU JEU\n\nLe jeu se termine immédiatement lorsqu'un joueur place son dernier pion sur la dernière case libre du camp opposé.\n\n
rules_17=HALMA ÉTOILE POUR 2 À 3 JOUEURS\n\nDans le Halma pour 3 joueurs, on utilise l'étoile à 6 branches au dos du plateau.\n\n
rules_18=Contrairement au plateau carré, sur le plateau étoile, les pions se déplacent de point en point le long des lignes au lieu de cases.\n\n
rules_19=HALMA SOLO POUR 1 JOUEUR\n\nLe Halma peut également être joué seul sur le plateau carré.\n\n
rules_20=Cette variante peut également être jouée avec 15 pions sur le plateau étoile.\n\n
rules_21=Tout compris ? Appuie encore une fois pour revenir :)\n\n

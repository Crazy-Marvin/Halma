# Rules Screen
rules_1=Jenis Permainan: Permainan taktis\nJumlah Pemain: 1-4\nUsia yang Disarankan: 8-88\nDurasi Permainan: sekitar 30-45 menit\n\n
rules_2=TUJUAN PERMAINAN:\n\nPemain pertama yang berhasil memindahkan semua bidaknya ke area rumah lawan dengan langkah yang cerdik memenangkan permainan.\n\n
rules_3=MATERI PERMAINAN:\n\n1 papan permainan dua sisi\n66 bidak Halma:\n19 hitam\n19 merah\n15 hijau\n13 kuning\n\n
rules_4=PERSIAPAN PERMAINAN\n\nPermainan dapat dimainkan oleh 2, 3, atau 4 pemain. Papan kotak mendukung 2 atau 4 pemain, sedangkan papan bintang mendukung 2 atau 3 pemain.\n\n
rules_5=Pengaturan pemain:\n2 pemain: 2 × 19 bidak\n3 pemain: 3 × 15 bidak\n4 pemain: 4 × 13 bidak\n\n
rules_6=Di papan kotak, terdapat 4 sudut dengan 13 ruang yang ditandai dengan garis biru. Ke-13 ruang ini disebut sebagai "area rumah kecil."\n\n
rules_7=Jika hanya 2 pemain yang bermain, dua area rumah besar yang berlawanan secara diagonal digunakan, masing-masing diisi hingga garis hitam dengan 19 bidak.\n\n
rules_8=JALANNYA PERMAINAN:\n\nSetiap pemain berusaha memindahkan semua bidaknya ke area rumah lawan secepat dan secerdik mungkin.\n\n
rules_9=GERAKAN\n\nSemua arah diperbolehkan: satu langkah ke samping, maju, mundur, diagonal, atau sesuai keinginan. Setiap ruang hanya boleh ditempati satu bidak.\n\n
rules_10=LOMPATAN\n\nBidak lawan atau sendiri yang berada tepat di depan atau di samping bisa dilompati jika ada ruang kosong di belakangnya.\n\n
rules_11=LOMPATAN BERANTAI\n\nLompatan berantai adalah serangkaian lompatan berturut-turut. Dalam satu giliran, beberapa bidak bisa dilompati sekaligus.\n\n
rules_12=Setiap pemain harus mencoba membangun rantai dengan bidaknya sendiri agar bisa maju lebih cepat.\n\n
rules_13=TIPS TAKTIK\n\nSebaiknya setiap pemain mencoba melompati sebanyak mungkin bidak dalam satu giliran agar lebih cepat mencapai area rumah lawan.\n\n
rules_14=Bidak lawan bisa dikurung di area rumahnya hingga saat terakhir. Demikian pula, seorang pemain bisa meninggalkan satu bidak di area rumahnya sendiri.\n\n
rules_15=Jika 4 pemain berpartisipasi, setiap pemain bisa berusaha menguasai satu area rumah sendiri.\n\n
rules_16=AKHIR PERMAINAN\n\nPermainan segera berakhir ketika seorang pemain menempatkan bidaknya yang terakhir di ruang target terakhir yang kosong di area rumah lawan.\n\n
rules_17=HALMA BINTANG UNTUK 2 HINGGA 3 PEMAIN\n\nDalam permainan Halma untuk 3 pemain, digunakan papan bintang enam sudut di bagian belakang papan permainan.\n\n
rules_18=Berbeda dengan papan kotak, pemain menggerakkan bidaknya dari titik ke titik di sepanjang garis, bukan pada ruang tertentu.\n\n
rules_19=HALMA SOLO UNTUK 1 PEMAIN\n\nHalma juga bisa dimainkan sendiri di papan kotak.\n\n
rules_20=Varian ini juga bisa dimainkan dengan 15 bidak di papan bintang.\n\n
rules_21=Sudah mengerti semuanya? Ketuk lagi untuk kembali :)\n\n

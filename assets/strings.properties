# Rules Screen
rules_1=Game Type: Tactical game\nNumber of Players: 1-4\nRecommended Age: 8-88\nGame Duration: approx. 30-45 minutes\n\n
rules_2=GAME OBJECTIVE:\n\nThe first player to skillfully move all their pieces into the opposite home area wins the game.\n\n
rules_3=GAME MATERIAL:\n\n1 double-sided game board\n66 Halma pieces:\n19 black\n19 red\n15 green\n13 yellow\n\n
rules_4=GAME PREPARATION\n\nThe game can be played by 2, 3, or 4 players. The square board supports 2 or 4 players, while the star board supports 2 or 3 players.\n\n
rules_5=Players setup:\n2 players: 2 × 19 pieces\n3 players: 3 × 15 pieces\n4 players: 4 × 13 pieces\n\n
rules_6=On the square board, there are 4 corners with 13 spaces, marked by a blue line. These 13 spaces together form the "small home area."\n\n
rules_7=If only 2 players are playing, the two diagonally opposite ?large home areas? are used, filling them up to the black line with 19 pieces.\n\n
rules_8=GAME FLOW:\n\nEach player attempts to move all their pieces into the opposite home area as quickly and skillfully as possible.\n\n
rules_9=MOVING\n\nAll directions are allowed: one space horizontally, vertically, diagonally, backward, or sideways, as desired. Only one piece can occupy a space at a time.\n\n
rules_10=JUMPING\n\nAn opponent's or own piece directly in front or beside a player's piece can be jumped over if there is an empty space immediately behind it.\n\n
rules_11=CHAIN JUMPS\n\nChain jumps are consecutive jumps. Multiple pieces can be jumped over in a single move.\n\n
rules_12=Each player should try to build chains with their own pieces to advance their team more quickly.\n\n
rules_13=TACTICAL TIPS\n\nIt is in every player's best interest to make as many jumps as possible in their turn to reach the opposite home area faster.\n\n
rules_14=An opponent?s piece can be trapped in their home area until the last moment. Similarly, a player can leave one piece behind in their home area.\n\n
rules_15=If 4 players are participating, each player can attempt to claim a home area for themselves.\n\n
rules_16=GAME END\n\nThe game ends immediately when a player places their last piece in the final free target space of the opposite home area.\n\n
rules_17=STAR HALMA FOR 2 TO 3 PLAYERS\n\nIn the Halma game for 3 players, the six-pointed star on the back of the game board is used.\n\n
rules_18=Unlike the square board, players move their pieces along lines from point to point instead of moving on spaces.\n\n
rules_19=HALMA SOLO FOR 1 PLAYER\n\nHalma can also be played solo on the square board.\n\n
rules_20=This variant can also be played with 15 pieces on the star board.\n\n
rules_21=Understood everything? Tap again to return :)\n\n
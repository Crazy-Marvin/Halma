# Rules Screen
rules_1=Speltyp: Takiskt spel\nAntal spelare: 1-4\nRekommenderad ålder: 8-88\nSpeltid: ca 30-45 minuter\n\n
rules_2=SPELMÅL:\n\nDen spelare som först lyckas flytta alla sina spelpjäser till motsatt hörn genom skickliga drag vinner spelet.\n\n
rules_3=SPELMATERIAL:\n\n1 dubbelsidigt spelbräde\n66 Halma-pjäser:\n19 svarta\n19 röda\n15 gröna\n13 gula\n\n
rules_4=SPELFÖRBEREDELSER:\n\nSpelet kan spelas av 2, 3 eller 4 personer. På kvadratbrädet kan 2 eller 4 spelare spela, och på stjärnbrädet kan 2 eller 3 spelare spela.\n\n
rules_5=Antal spelpjäser per spelare:\n2 spelare: 2 × 19 pjäser\n3 spelare: 3 × 15 pjäser\n4 spelare: 4 × 13 pjäser\n\n
rules_6=Kvadratbrädet har 4 hörn med 13 rutor, avgränsade av en blå linje. Dessa 13 rutor kallas tillsammans för "lilla gården".\n\n
rules_7=Om endast 2 personer spelar, placeras 19 pjäser i de två stora motsatta gårdarna fram till den svarta linjen.\n\n
rules_8=SPELFÖRLOPP:\n\nVarje spelare försöker så snabbt och skickligt som möjligt flytta sina spelpjäser till den motsatta gården.\n\n
rules_9=DRAG:\n\nAlla riktningar är tillåtna: en ruta horisontellt, vertikalt, diagonalt, bakåt eller åt sidan. Endast en pjäs får stå på varje ruta.\n\n
rules_10=HOPP:\n\nEn pjäs, oavsett om den tillhör motståndaren eller spelaren själv, kan hoppas över om det finns en tom ruta direkt bakom.\n\n
rules_11=KEDJEHOPP:\n\nKedjehopp innebär att flera hopp görs i följd. Flera pjäser kan hoppas över i en och samma tur.\n\n
rules_12=Varje spelare bör försöka bygga upp kedjor med sina egna pjäser för att snabbare komma framåt.\n\n
rules_13=TAKTISKA SPELTIPS:\n\nDet är fördelaktigt att göra så många hopp som möjligt i varje drag för att snabbare nå motsatt gård.\n\n
rules_14=En motståndares pjäs kan hållas inlåst i sin gård fram till slutet av spelet. En spelare kan också lämna kvar en egen pjäs i sin gård.\n\n
rules_15=Om 4 spelare deltar i spelet kan varje spelare försöka erövra en av gårdarna.\n\n
rules_16=SPELETS SLUT:\n\nSpelet slutar omedelbart när en spelare placerar sin sista pjäs på det sista lediga målfältet i motsatt gård.\n\n
rules_17=STJÄRNHALMA FÖR 2-3 SPELARE:\n\nNär Halma spelas av 3 personer används den sexuddiga stjärnan på baksidan av spelbrädet.\n\n
rules_18=Till skillnad från kvadratbrädet flyttas pjäserna på stjärnbrädet längs linjer från punkt till punkt.\n\n
rules_19=HALMA SOLO FÖR 1 SPELARE:\n\nHalma kan också spelas ensam på kvadratbrädet.\n\n
rules_20=Denna variant kan också spelas med 15 pjäser på stjärnbrädet.\n\n
rules_21=Allt förstått? Tryck igen för att återgå :)\n\n

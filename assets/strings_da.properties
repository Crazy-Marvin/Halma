# Rules Screen
rules_1=Spiltype: Taktisk spil\nAntal spillere: 1-4\nAnbefalet alder: 8-88\nSpilletid: ca. 30-45 minutter\n\n
rules_2=SPILLETS MÅL:\n\nDen spiller, der først får alle sine brikker flyttet til den modsatte hjemmebane gennem kloge træk, vinder spillet.\n\n
rules_3=SPILMATERIALE:\n\n1 dobbeltsidet spilleplade\n66 Halma-brikker:\n19 sorte\n19 røde\n15 grønne\n13 gule\n\n
rules_4=FORBEREDELSE\n\nSpillet kan spilles af 2, 3 eller 4 personer. På kvadratbrættet kan 2 eller 4 spillere spille, mens stjernebrættet er for 2 eller 3 spillere.\n\n
rules_5=Spilleropsætning:\n2 spillere: 2 × 19 brikker\n3 spillere: 3 × 15 brikker\n4 spillere: 4 × 13 brikker\n\n
rules_6=Kvadratbrættet har 4 hjørner med 13 felter, markeret med en blå linje. Disse 13 felter kaldes samlet for ?den lille hjemmebane.?\n\n
rules_7=Hvis kun 2 spillere deltager, anvendes de diagonalt modsatte store hjemmebaner, hver fyldt med 19 brikker op til den sorte linje.\n\n
rules_8=SPILFORLØB:\n\nHver spiller forsøger at flytte sine brikker til den modsatte hjemmebane så hurtigt og taktisk som muligt.\n\n
rules_9=BEVÆGELSE\n\nAlle retninger er tilladt: ét felt vandret, lodret, diagonalt, baglæns eller sidelæns efter ønske. Hvert felt må kun indeholde én brik.\n\n
rules_10=SPRING\n\nEn modstanders eller egen brik, der står direkte foran eller ved siden af, kan springes over, hvis der er et ledigt felt umiddelbart bagved.\n\n
rules_11=KÆDESPRING\n\nKædespring er successive spring i én tur. Flere brikker kan springes over i samme tur.\n\n
rules_12=Hver spiller bør forsøge at skabe kæder med sine egne brikker for at fremskynde sin fremrykning.\n\n
rules_13=TAKTISKE TIPS\n\nDet er i enhver spillers interesse at forsøge at springe så meget som muligt i en tur for hurtigere at nå den modsatte hjemmebane.\n\n
rules_14=En modstanders brik kan holdes fanget i dens hjemmebane indtil sidste øjeblik. En spiller kan også vælge at efterlade en brik i sin egen hjemmebane.\n\n
rules_15=Hvis 4 spillere deltager, kan hver spiller forsøge at erobre en af hjemmebanerne.\n\n
rules_16=SPILLETS AFSLUTNING\n\nSpillet slutter øjeblikkeligt, når en spiller placerer sin sidste brik på det sidste ledige felt i den modsatte hjemmebane.\n\n
rules_17=STJERNE-HALMA FOR 2 TIL 3 SPILLERE\n\nI Halma for 3 spillere bruges den sekskantede stjerne på bagsiden af spillepladen.\n\n
rules_18=I modsætning til kvadratbrættet bevæger spillerne deres brikker fra punkt til punkt langs linjer i stedet for at stå på felter.\n\n
rules_19=HALMA SOLO FOR 1 SPILLER\n\nHalma kan også spilles alene på kvadratbrættet.\n\n
rules_20=Denne variant kan også spilles med 15 brikker på stjernebrættet.\n\n
rules_21=Forstået det hele? Tryk igen for at vende tilbage :)\n\n

# Rules Screen
rules_1=Spilltype: Strategispill\nAntall spillere: 1-4\nAnbefalt alder: 8-88 år\nSpilletid: ca. 30-45 minutter\n\n
rules_2=SPILLMÅL:\n\nDen spilleren som først klarer å flytte alle sine brikker til den motsatte gården ved hjelp av smarte trekk, vinner spillet.\n\n
rules_3=SPILLMATERIELL:\n\n1 dobbelsidig spillebrett\n66 Halma-brikker:\n19 svarte\n19 røde\n15 grønne\n13 gule\n\n
rules_4=FORBEREDELSER:\n\nSpillet kan spilles av 2, 3 eller 4 personer. Med ruteplanen kan 2 eller 4 spillere delta, mens stjerneplanen er for 2 eller 3 spillere.\n\n
rules_5=Antall brikker per spiller:\n2 spillere: 2 × 19 brikker\n3 spillere: 3 × 15 brikker\n4 spillere: 4 × 13 brikker\n\n
rules_6=På ruteplanen er det 4 hjørner med 13 felter, avgrenset av en blå linje. Disse 13 feltene kalles "den lille gården".\n\n
rules_7=Hvis bare 2 personer spiller, plasseres 19 brikker i de to store gårdene som ligger diagonalt overfor hverandre, opp til den svarte linjen.\n\n
rules_8=SPILLGANG:\n\nHver spiller prøver å flytte sine brikker så raskt og taktisk som mulig til den motsatte gården.\n\n
rules_9=TREKK:\n\nAlle retninger er tillatt: ett felt horisontalt, vertikalt, diagonalt, bakover eller sidelengs. Kun én brikke kan stå på hvert felt.\n\n
rules_10=HOPP:\n\nBåde egne og motstanderens brikker kan hoppes over, så lenge det er et ledig felt rett bak brikken.\n\n
rules_11=KJEDESPRANG:\n\nKjeder av sprang betyr at flere brikker kan hoppes over i én tur, så lenge det er ledige felter bak hver av dem.\n\n
rules_12=Hver spiller bør prøve å lage hoppkjeder med sine egne brikker for å komme raskere fremover.\n\n
rules_13=TAKTISKE TIPS:\n\nDet lønner seg å hoppe så mange ganger som mulig i én tur for å komme raskere til den motsatte gården.\n\n
rules_14=En motstanders brikke kan holdes fanget i sin egen gård til slutten av spillet. En spiller kan også velge å la en brikke stå igjen i sin egen gård.\n\n
rules_15=Hvis 4 personer spiller, kan hver spiller prøve å erobre en av gårdene for seg selv.\n\n
rules_16=SPILLETS SLUTT:\n\nSpillet er over så snart en spiller plasserer sin siste brikke på det siste ledige målfeltet i den motsatte gården.\n\n
rules_17=STJERNE-HALMA FOR 2-3 SPILLERE:\n\nNår Halma spilles med 3 spillere, brukes den sekskantede stjerneplanen på baksiden av brettet.\n\n
rules_18=I motsetning til ruteplanen flyttes brikkene ikke fra felt til felt, men langs linjer fra punkt til punkt.\n\n
rules_19=HALMA SOLO FOR 1 SPILLER:\n\nHalma kan også spilles alene på ruteplanen.\n\n
rules_20=Denne varianten kan også spilles med 15 brikker på stjerneplanen.\n\n
rules_21=Forstått alt? Trykk én gang til for å gå tilbake :)\n\n

# Rules Screen
rules_1=Tipo de juego: Juego táctico\nNúmero de jugadores: 1-4\nEdad recomendada: 8-88\nDuración del juego: aprox. 30-45 minutos\n\n
rules_2=OBJETIVO DEL JUEGO:\n\nEl jugador que primero logre mover todas sus piezas al área opuesta mediante movimientos estratégicos gana la partida.\n\n
rules_3=MATERIAL DEL JUEGO:\n\n1 tablero de doble cara\n66 piezas de Halma:\n19 negras\n19 rojas\n15 verdes\n13 amarillas\n\n
rules_4=PREPARACIÓN DEL JUEGO\n\nEl juego puede jugarse con 2, 3 o 4 jugadores. En el tablero cuadrado pueden jugar 2 o 4 jugadores, mientras que en el tablero de estrella pueden jugar 2 o 3 jugadores.\n\n
rules_5=Jugadores:\n2 jugadores con 2 × 19 piezas\n3 jugadores con 3 × 15 piezas\n4 jugadores con 4 × 13 piezas\n\n
rules_6=El tablero cuadrado tiene 4 esquinas con 13 casillas, delimitadas por una línea azul. Estas 13 casillas forman el ?área pequeña?.\n\n
rules_7=Si solo juegan 2 personas, cada una ocupa un ?área grande? diagonalmente opuesta con 19 piezas hasta la línea negra.\n\n
rules_8=DESARROLLO DEL JUEGO:\n\nCada jugador intenta mover sus piezas al área opuesta lo más rápido y estratégicamente posible.\n\n
rules_9=MOVIMIENTOS\n\nSe permiten movimientos en todas las direcciones: una casilla en horizontal, vertical, diagonal, hacia atrás o hacia los lados. En cada casilla solo puede haber una pieza.\n\n
rules_10=SALTOS\n\nSe puede saltar sobre una pieza propia o del oponente si está justo delante o al lado y hay una casilla libre detrás.\n\n
rules_11=SALTOS EN CADENA\n\nLos saltos en cadena son saltos consecutivos. En un solo turno, se pueden saltar varias piezas seguidas.\n\n
rules_12=Cada jugador debe intentar formar cadenas con sus propias piezas para avanzar más rápido.\n\n
rules_13=CONSEJOS ESTRATÉGICOS\n\nEs recomendable saltar lo máximo posible en un turno para llegar más rápido al área opuesta.\n\n
rules_14=Una pieza del oponente puede quedar bloqueada en su área hasta el final del juego. Del mismo modo, un jugador puede dejar una pieza en su propia área.\n\n
rules_15=Si juegan 4 personas, cada jugador puede intentar conquistar una de las áreas.\n\n
rules_16=FINAL DEL JUEGO\n\nEl juego termina inmediatamente cuando un jugador coloca su última pieza en la última casilla libre del área opuesta.\n\n
rules_17=HALMA ESTRELLA PARA 2 A 3 JUGADORES\n\nEn el Halma para 3 jugadores, se usa la estrella de 6 puntas en el reverso del tablero.\n\n
rules_18=A diferencia del tablero cuadrado, en el tablero de estrella las piezas se mueven de punto a punto a lo largo de las líneas en lugar de casillas.\n\n
rules_19=HALMA SOLO PARA 1 JUGADOR\n\nEl Halma también se puede jugar solo en el tablero cuadrado.\n\n
rules_20=Esta variante también se puede jugar con 15 piezas en el tablero de estrella.\n\n
rules_21=¿Lo entendiste todo? Pulsa de nuevo para volver :)\n\n
